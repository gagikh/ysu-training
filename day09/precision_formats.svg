<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="system-ui, -apple-system, Segoe UI, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
  .bg{fill:#ffffff}
  .lbl{fill:#1a1a1a;font-size:14px;font-weight:600}
  .note{fill:#5a5a5a;font-size:11.5px}
  .bits{fill:#ffffff;font-size:11px;font-weight:600}
  .hdr{fill:#3a3a3a;font-size:11.5px;font-weight:600;letter-spacing:.04em}
  .s{fill:#9aa0a6}
  .e{fill:#2f6fb5}
  .m{fill:#3f9a6a}
  .ax{stroke:#d0d0d0;stroke-width:1}
  @media (prefers-color-scheme: dark){
    .bg{fill:#17191c}
    .lbl{fill:#eceff1}
    .note{fill:#9aa4ad}
    .hdr{fill:#c2cad1}
    .s{fill:#6b7378}
    .e{fill:#4f8fd0}
    .m{fill:#4fb183}
    .ax{stroke:#3a3f45}
  }
</style>
<rect class="bg" width="760" height="330"/>
<text class="hdr" x="132" y="28">SIGN</text>
<text class="hdr" x="192" y="28">EXPONENT  — range</text>
<text class="hdr" x="392" y="28">MANTISSA  — precision</text>
<line class="ax" x1="132" y1="38" x2="672" y2="38"/>
<text class="lbl" x="8" y="78">fp64</text>
<text class="note" x="58" y="78">64 bit</text>
<rect class="s" x="132.0" y="60" width="8.4" height="26" rx="2"/>
<rect class="e" x="141.9" y="60" width="91.3" height="26" rx="2"/>
<text class="bits" x="187.6" y="78" text-anchor="middle">11</text>
<rect class="m" x="234.8" y="60" width="437.2" height="26" rx="2"/>
<text class="bits" x="453.4" y="78" text-anchor="middle">52</text>
<text class="note" x="683.5" y="78">double</text>
<text class="lbl" x="8" y="122">fp32</text>
<text class="note" x="58" y="122">32 bit</text>
<rect class="s" x="132.0" y="104" width="8.4" height="26" rx="2"/>
<rect class="e" x="141.9" y="104" width="66.0" height="26" rx="2"/>
<text class="bits" x="174.9" y="122" text-anchor="middle">8</text>
<rect class="m" x="209.4" y="104" width="192.6" height="26" rx="2"/>
<text class="bits" x="305.7" y="122" text-anchor="middle">23</text>
<text class="note" x="413.5" y="122">float</text>
<text class="lbl" x="8" y="166">tf32</text>
<text class="note" x="58" y="166">19 bit</text>
<rect class="s" x="132.0" y="148" width="8.4" height="26" rx="2"/>
<rect class="e" x="141.9" y="148" width="66.0" height="26" rx="2"/>
<text class="bits" x="174.9" y="166" text-anchor="middle">8</text>
<rect class="m" x="209.4" y="148" width="82.9" height="26" rx="2"/>
<text class="bits" x="250.9" y="166" text-anchor="middle">10</text>
<text class="note" x="303.8" y="166">tensor core input only</text>
<text class="lbl" x="8" y="210">bf16</text>
<text class="note" x="58" y="210">16 bit</text>
<rect class="s" x="132.0" y="192" width="8.4" height="26" rx="2"/>
<rect class="e" x="141.9" y="192" width="66.0" height="26" rx="2"/>
<text class="bits" x="174.9" y="210" text-anchor="middle">8</text>
<rect class="m" x="209.4" y="192" width="57.6" height="26" rx="2"/>
<text class="bits" x="238.2" y="210" text-anchor="middle">7</text>
<text class="note" x="278.5" y="210">fp32 range, less precision</text>
<text class="lbl" x="8" y="254">fp16</text>
<text class="note" x="58" y="254">16 bit</text>
<rect class="s" x="132.0" y="236" width="8.4" height="26" rx="2"/>
<rect class="e" x="141.9" y="236" width="40.7" height="26" rx="2"/>
<text class="bits" x="162.3" y="254" text-anchor="middle">5</text>
<rect class="m" x="184.1" y="236" width="82.9" height="26" rx="2"/>
<text class="bits" x="225.6" y="254" text-anchor="middle">10</text>
<text class="note" x="278.5" y="254">__half</text>
<text class="note" x="8" y="294">Same exponent width means the same overflow and underflow limits: bf16 and tf32 carry fp32’s range, fp16 does not.</text>
<text class="note" x="8" y="312">Mixed precision means narrow inputs with a wider accumulator — what a tensor core does in hardware: fp16 or bf16 in, fp32 out.</text>
</svg>